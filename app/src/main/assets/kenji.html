<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kenji Space</title>
<style>
  :root { --bg:#121214; --card:#1c1c20; --line:#2a2a32; --text:#ececf4; --dim:#8b8b9c; --acc:#c45cff; --cyan:#3ee0d4; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text);
    font:15px/1.35 -apple-system,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; overflow:hidden; padding-top:36px; }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px 0; }
  header h1 { margin:0; flex:1; font-size:20px; display:flex; align-items:center; gap:8px; }
  .mark { width:36px; height:36px; border-radius:10px; background:#1c1c20; color:#c45cff; font:800 18px/36px inherit; text-align:center; border:1px solid #3ee0d4; }
  .iconbtn { height:36px; border-radius:12px; border:1px solid var(--line); background:#1c1c26; color:var(--text); padding:0 10px; font:600 13px inherit; }
  .search { margin:10px 12px 8px; height:42px; border-radius:12px; border:1px solid var(--line); background:#1a1a20; display:flex; align-items:center; padding:0 12px; }
  .search input { flex:1; border:0; outline:0; background:transparent; color:var(--text); font:inherit; }
  .grid { flex:1; overflow:auto; padding:4px 10px 96px; display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:12px; align-content:start; }
  .tile { border:0; background:transparent; padding:0; color:inherit; text-align:left; }
  .cover { width:100%; aspect-ratio:1; border-radius:16px; background:linear-gradient(160deg,#2a1630,#16222a); display:flex; align-items:center; justify-content:center; color:var(--acc); font-size:28px; font-weight:700; }
  .tile .nm { margin-top:6px; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .add { border:1px dashed var(--line); border-radius:16px; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--dim); background:#16161c; }
  .add b { font-size:32px; font-weight:400; color:var(--text); }
  .bar { position:absolute; left:12px; right:12px; bottom:14px; border:1px solid var(--line); border-radius:12px; background:#16161c; padding:8px 10px; font-size:12px; color:var(--dim); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sheet { display:flex; position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:6; align-items:flex-end; opacity:0; visibility:hidden; pointer-events:none; }
  .sheet.on { opacity:1; visibility:visible; pointer-events:auto; }
  .sheet .box { width:100%; background:#14141a; border-radius:18px 18px 0 0; padding:16px 16px 24px; max-height:80%; overflow:auto; }
  .sheet h2 { margin:0 0 10px; font-size:16px; }
  .ghost { background:transparent; color:var(--cyan); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:600 13px inherit; }
  .tog { display:flex; gap:10px; align-items:center; border-top:1px solid var(--line); padding:8px 0; }
  .tog .nm { flex:1; } .tog .nm b { display:block; font-size:13px; } .tog .nm span { color:var(--dim); font-size:11.5px; }
  .sw { min-width:52px; height:30px; border-radius:999px; border:1px solid var(--line); background:#1c1c26; color:var(--dim); font:700 11px inherit; }
  .sw.on { background:var(--cyan); color:#062; border-color:transparent; }
  .note { color:var(--dim); font-size:12.5px; margin:8px 0; word-break:break-all; }
  .plug { border:1px solid var(--line); border-radius:12px; padding:8px 10px; margin:6px 0; display:flex; gap:8px; align-items:center; }
  .empty { color:var(--dim); text-align:center; padding:30px 12px; grid-column:1/-1; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
</style>
</head>
<body>
<header>
  <h1><span class="mark">K</span> Kenji Space</h1>
  <button class="iconbtn" id="btn-plugins">Плагины</button>
  <button class="iconbtn" id="btn-settings">Настройки</button>
</header>
<div class="search"><input id="q" placeholder="Search…" autocomplete="off"></div>
<div class="grid" id="grid"><div class="empty">загрузка…</div></div>
<div class="bar" id="bar">
  <span id="core">ядро…</span>
  <button class="ghost" id="btn-dl">Скачать ядро</button>
  <button class="ghost" id="btn-folder">＋ Папка</button>
</div>
<div class="sheet" id="sheet"><div class="box"><h2 id="sheet-title"></h2><div class="note" id="sheet-note"></div><div class="row" id="sheet-actions"></div></div></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const N = () => window.Kenji || null;
function call(name, ...a) { try { const n=N(); return n && n[name] ? n[name](...a) : null; } catch(e) { return null; } }
function parse(s, fb) { try { return s ? JSON.parse(s) : fb; } catch(e) { return fb; } }

let GAMES = [];
function loadGames() {
  GAMES = (parse(call('games'), { games: [] }).games) || [];
  render();
}
function render() {
  const q = ($('q').value || '').trim().toLowerCase();
  const list = q ? GAMES.filter(g => (g.title||'').toLowerCase().includes(q)) : GAMES;
  const add = '<button class="add" id="add" type="button"><b>+</b>папка</button>';
  if (!list.length) {
    $('grid').innerHTML = add + '<div class="empty">нет игр — добавьте папку с nsp/xci</div>';
  } else {
    $('grid').innerHTML = add + list.map((g,i) =>
      `<button class="tile" data-i="${i}" type="button"><div class="cover">▶</div><div class="nm">${esc(g.title||'без имени')}</div></button>`
    ).join('');
    $('grid').querySelectorAll('.tile').forEach(el => {
      el.onclick = () => {
        const g = list[+el.dataset.i];
        if (g && N() && N().launch) N().launch(g.path, g.title || '');
      };
    });
  }
  const a = $('add'); if (a) a.onclick = () => { if (N() && N().pickFolder) N().pickFolder(); };
}
function paintCore() {
  const c = parse(call('core'), { state: 'missing', note: '' });
  $('core').textContent = c.note || c.state || 'ядро';
  $('btn-dl').style.display = c.state === 'ready' ? 'none' : '';
}
function loadStatus() { paintCore(); }
function onFolderAdded() { loadGames(); }
function onCoreProgress(info) {
  const d = info.done||0, t = info.total||0;
  $('core').textContent = t>0 ? ('скачиваю '+Math.floor(d/1048576)+' / '+Math.floor(t/1048576)+' МБ') : ('скачиваю '+Math.floor(d/1048576)+' МБ');
}
function onCoreDone(info) { $('core').textContent = (info && info.message) || 'готово'; paintCore(); }

function openSheet() { $('sheet').classList.add('on'); }
function closeSheet() { $('sheet').classList.remove('on'); }

function openSettings() {
  const live = parse(call('settings'), { toggles: [] });
  $('sheet-title').textContent = 'Настройки';
  let html = '<div class="note">Каждый тумблер сразу commit() на диск. Официальный Kenji терял это на apply() + краш.</div>';
  (live.toggles||[]).forEach(tg => {
    html += `<div class="tog"><div class="nm"><b>${esc(tg.label)}</b><span>${esc(tg.hint||'')}</span></div>
      <button class="sw ${tg.on?'on':''}" data-key="${esc(tg.key)}">${tg.on?'вкл':'выкл'}</button></div>`;
  });
  $('sheet-note').innerHTML = html;
  $('sheet-actions').innerHTML = '<button class="ghost" id="a-close">Закрыть</button>';
  $('a-close').onclick = closeSheet;
  $('sheet-note').querySelectorAll('.sw').forEach(btn => {
    btn.onclick = () => {
      const now = !btn.classList.contains('on');
      const r = parse(call('setBool', btn.dataset.key, now), {});
      $('core').textContent = r.message || '';
      openSettings();
    };
  });
  openSheet();
}

function openPlugins() {
  const data = parse(call('plugins'), { items: [] });
  $('sheet-title').textContent = 'Плагины';
  const items = data.items || [];
  $('sheet-note').innerHTML = items.length ? items.map(it =>
    `<div class="plug"><div class="nm"><b>${esc(it.name||it.id)}</b></div>
      <button class="ghost p-tog" data-id="${esc(it.id)}">${it.enabled===false?'Вкл':'Скрыть'}</button>
      <button class="ghost p-del" data-id="${esc(it.id)}">Снести</button></div>`
  ).join('') : '<div class="empty">пусто — zip/json/css</div>';
  $('sheet-actions').innerHTML = '<button class="ghost" id="a-add">＋ Файл</button><button class="ghost" id="a-close">Закрыть</button>';
  $('a-add').onclick = () => { if (N() && N().pickPlugin) N().pickPlugin(); };
  $('a-close').onclick = closeSheet;
  $('sheet-note').querySelectorAll('.p-tog').forEach(b => {
    b.onclick = () => { parse(call('enablePlugin', b.dataset.id, b.textContent.indexOf('Вкл')>=0), {}); applyPlugins(); openPlugins(); };
  });
  $('sheet-note').querySelectorAll('.p-del').forEach(b => {
    b.onclick = () => { parse(call('removePlugin', b.dataset.id), {}); applyPlugins(); openPlugins(); };
  });
  openSheet();
}
function onPluginsChanged() { applyPlugins(); openPlugins(); }
function applyPlugins() {
  const p = parse(call('pluginPayload'), null);
  if (!p) return;
  Object.keys(p.theme||{}).forEach(k => { try { document.documentElement.style.setProperty(k, p.theme[k]); } catch(e){} });
  let st = document.getElementById('plugin-css');
  if (!st) { st = document.createElement('style'); st.id='plugin-css'; document.head.appendChild(st); }
  st.textContent = p.css || '';
}

$('q').addEventListener('input', render);
$('btn-settings').onclick = openSettings;
$('btn-plugins').onclick = openPlugins;
$('btn-folder').onclick = () => { if (N() && N().pickFolder) N().pickFolder(); };
$('btn-dl').onclick = () => { if (N() && N().downloadCore) N().downloadCore(); };
$('sheet').addEventListener('click', e => { if (e.target.id==='sheet') closeSheet(); });
loadGames(); loadStatus(); applyPlugins();
</script>
</body>
</html>
