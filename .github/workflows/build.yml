name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        options: [debug, release]
        default: release
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" || true
      - name: Embed Kenji core
        run: |
          # Official name is libkenjinx.so. Same file we already built
          # (engine-kenji). Shipping it in jniLibs means the player does
          # not depend on a download that can be missing or still writable.
          set -euo pipefail
          DEST=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          URL=https://github.com/sj0404-collab/eden-symbiosis/releases/download/engine-kenji/libkenji.so
          WANT=969431b3962408dd02ce38bd2cd4b2a954d11e5212ddef3f65c80a0b419918b8
          curl -fL --retry 3 -o "$DEST/libkenjinx.so" "$URL"
          GOT=$(sha256sum "$DEST/libkenjinx.so" | awk '{print $1}')
          echo "core sha256 $GOT"
          test "$GOT" = "$WANT"
          ls -lh "$DEST"
      - name: Build
        run: |
          TYPE=${{ github.event.inputs.build_type || 'release' }}
          if [ "$TYPE" = debug ]; then TASK=assembleDebug; else TASK=assembleRelease; fi
          gradle --no-daemon $TASK
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          echo "MD5=$(md5sum "$APK" | cut -d' ' -f1)"
          echo "SIZE=$(du -h "$APK" | cut -f1)"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Kenji-Space
          path: app/build/outputs/apk/**/*.apk
      - name: Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" Kenji-Space.apk
          gh release delete latest --yes || true
          gh release create latest Kenji-Space.apk \
            --title "Kenji Space" \
            --notes "Лёгкая оболочка Kenji. Ядро скачивается отдельно. MD5 $(md5sum Kenji-Space.apk | cut -d' ' -f1)"
