name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        options: [debug, release]
        default: release
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" || true
      - name: Build
        run: |
          TYPE=${{ github.event.inputs.build_type || 'release' }}
          if [ "$TYPE" = debug ]; then TASK=assembleDebug; else TASK=assembleRelease; fi
          gradle --no-daemon $TASK
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          echo "MD5=$(md5sum "$APK" | cut -d' ' -f1)"
          echo "SIZE=$(du -h "$APK" | cut -f1)"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Kenji-Space
          path: app/build/outputs/apk/**/*.apk
      - name: Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" Kenji-Space.apk
          gh release delete latest --yes || true
          gh release create latest Kenji-Space.apk \
            --title "Kenji Space" \
            --notes "Лёгкая оболочка Kenji. Ядро скачивается отдельно. MD5 $(md5sum Kenji-Space.apk | cut -d' ' -f1)"
