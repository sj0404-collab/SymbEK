name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        options: [debug, release]
        default: release
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: kenji-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: NDK and CMake
        run: |
          yes | sdkmanager --install \
            "platform-tools" "platforms;android-35" \
            "build-tools;34.0.0" "build-tools;35.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Embed official Kenji-NX 2.1.0-pr.2 natives
        run: |
          # Same .so set as kenji-nx-v2.1.0-pr.2-standard.apk:
          # libkenjinx + official jni + OpenAL + FFmpeg + OpenSSL +
          # SDL2 + Skia + adrenotools hooks. Not the older engine-kenji dump.
          set -euo pipefail
          DEST=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          ZIP=/tmp/natives-2.1.0-pr.2.zip
          URL=https://github.com/sj0404-collab/kenji-symbiosis/releases/download/natives-2.1.0-pr.2/natives-2.1.0-pr.2.zip
          OFFICIAL=https://git.ryujinx.app/Kenji-NX/Android/releases/download/2.1.0-pr.2/kenji-nx-v2.1.0-pr.2-standard.apk
          WANT_ZIP=76b3ee2195d851b5756a7d5347219644d0a7d26a5c34bf848192acd3cc901146
          WANT_CORE=d781048671e4cef1cde2ec15db8fe29b949df9949d83569ceaf776ad12901590
          if curl -fL --retry 3 -o "$ZIP" "$URL"; then
            GOT_ZIP=$(sha256sum "$ZIP" | awk '{print $1}')
            echo "natives zip sha256 $GOT_ZIP"
            test "$GOT_ZIP" = "$WANT_ZIP"
            unzip -o "$ZIP" -d "$DEST"
          else
            echo "zip mirror missed, taking official APK"
            APK=/tmp/kenji-official.apk
            curl -fL --retry 3 -o "$APK" "$OFFICIAL"
            test "$(stat -c%s "$APK")" = "49840045"
            unzip -o -j "$APK" 'lib/arm64-v8a/*' -d "$DEST"
          fi
          GOT_CORE=$(sha256sum "$DEST/libkenjinx.so" | awk '{print $1}')
          echo "libkenjinx.so sha256 $GOT_CORE"
          test "$GOT_CORE" = "$WANT_CORE"
          test -f "$DEST/libavcodec.so"
          test -f "$DEST/libssl.so"
          test -f "$DEST/libsdl2.so"
          test -f "$DEST/libskiasharp.so"
          test -f "$DEST/libkenjinxjni.so"
          ls -lh "$DEST"
      - name: Restore the release keystore
        # Debug builds use the Android debug key. Release builds use one
        # permanent key, otherwise every GitHub runner creates a different
        # signature and Android rejects the next update.
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'debug' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::нет секрета KEYSTORE_B64 — release будет неустановимым поверх"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kenji-release.jks"
          test -s "$RUNNER_TEMP/kenji-release.jks"

      - name: Build in GitHub Actions
        env:
          # For debug there is deliberately no keystore file; Gradle falls
          # back to the Android debug key. For release this path was restored
          # by the previous step.
          KENJI_KEYSTORE: ${{ runner.temp }}/kenji-release.jks
          KENJI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KENJI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KENJI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            TYPE="${{ github.event.inputs.build_type }}"
          else
            # Every push to main is a signed release. The same keystore is
            # restored from repository secrets on every runner.
            TYPE=release
          fi
          if [ "$TYPE" = debug ]; then TASK=assembleDebug; else TASK=assembleRelease; fi

          # versionCode обязан расти от сборки к сборке, иначе установка
          # поверх отклоняется как "откат версии".
          # versionCode is monotonically generated by GitHub Actions. It is
          # deliberately well above the old fork's codes so a release from
          # SymbEK is never mistaken for a downgrade.
          BASE=1000
          export KENJI_VERSION_CODE=$(( BASE + GITHUB_RUN_NUMBER ))
          export KENJI_VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          echo "версия: $KENJI_VERSION_NAME (code $KENJI_VERSION_CODE)"

          gradle --no-daemon $TASK
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          echo "MD5=$(md5sum "$APK" | cut -d' ' -f1)"
          echo "SIZE=$(du -h "$APK" | cut -f1)"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "KENJI_VERSION_NAME=$KENJI_VERSION_NAME" >> "$GITHUB_ENV"
          echo "KENJI_VERSION_CODE=$KENJI_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Verify the actual APK payload
        run: |
          set -euo pipefail
          test -n "${APK_PATH:-}"
          unzip -l "$APK_PATH" | grep -E 'lib/arm64-v8a/lib(kenjinx|kenjinxjni|symbiosis_kenji)\.so'
          unzip -l "$APK_PATH" | grep 'assets/kenji.html'
          test "$(stat -c%s "$APK_PATH")" -gt 40000000

      - name: Show the signing fingerprint
        # Печатается, чтобы было видно: подпись та же, что в прошлый раз.
        # Если отпечаток изменился - обновление поверх не встанет, и знать
        # об этом надо здесь, а не на телефоне.
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK_PATH" | grep -i "SHA-256\|SHA-1" || true
      - uses: actions/upload-artifact@v4
        with:
          name: Kenji-Space
          path: app/build/outputs/apk/**/*.apk
      - name: Release
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'debug' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" Kenji-Space.apk
          MD5=$(md5sum Kenji-Space.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s Kenji-Space.apk)
          # GitHub occasionally 503s on delete; create then fails with
          # "tag already exists" and the APK is left only as an artifact.
          for i in 1 2 3 4 5; do
            gh release delete latest --yes && break || true
            sleep $((i * 2))
          done
          git push origin :refs/tags/latest || true
          for i in 1 2 3 4 5; do
            if gh release create latest Kenji-Space.apk \
              --title "Kenji Space ${KENJI_VERSION_NAME}" \
              --notes "Версия ${KENJI_VERSION_NAME} (code ${KENJI_VERSION_CODE}). Подписано постоянным ключом — ставится поверх предыдущей без удаления. Ядро официального Kenji-NX 2.1.0-pr.2. MD5 ${MD5} · ${SIZE} байт"
            then
              exit 0
            fi
            echo "release create failed, try $i"
            sleep $((i * 3))
          done
          echo "::error::не смог выложить latest после 5 попыток — APK в артефактах"
          exit 1
