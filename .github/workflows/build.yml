name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        options: [debug, release]
        default: release
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: kenji-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: SDK tools
        run: |
          yes | sdkmanager --install \
            "platform-tools" "platforms;android-35" \
            "build-tools;34.0.0" "build-tools;35.0.0" || true
      - name: Restore the release keystore
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'debug' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::нет секрета KEYSTORE_B64"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kenji-release.jks"
          test -s "$RUNNER_TEMP/kenji-release.jks"

      - name: Official Kenji home + silent firmware seed
        env:
          KENJI_KEYSTORE: ${{ runner.temp }}/kenji-release.jks
          KENJI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KENJI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KENJI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BASE=1000
          export KENJI_VERSION_CODE=$(( BASE + GITHUB_RUN_NUMBER ))
          export KENJI_VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"
          echo "версия: $KENJI_VERSION_NAME (code $KENJI_VERSION_CODE)"

          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name android.jar | sort | tail -1)
          test -n "$ANDROID_JAR"
          mkdir -p /tmp/shell-cls
          javac --release 17 -encoding UTF-8 -cp "$ANDROID_JAR" -d /tmp/shell-cls \
            shell/src/dev/symbiosis/kenji/DataSeed.java \
            shell/src/dev/symbiosis/kenji/SeedProvider.java
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools"/* | sort | tail -1)
          mkdir -p /tmp/shell-dex
          find /tmp/shell-cls -name '*.class' > /tmp/shell-cls.txt
          "$BUILD_TOOLS/d8" --min-api 29 --output /tmp/shell-dex $(cat /tmp/shell-cls.txt)
          test -f /tmp/shell-dex/classes.dex

          OFFICIAL=https://git.ryujinx.app/Kenji-NX/Android/releases/download/2.1.0-pr.2/kenji-nx-v2.1.0-pr.2-standard.apk
          APK_IN=/tmp/kenji-official.apk
          curl -fL --retry 3 -o "$APK_IN" "$OFFICIAL"
          test "$(stat -c%s "$APK_IN")" = "49840045"

          curl -fL --retry 3 -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          java -jar /tmp/apktool.jar d -s -f "$APK_IN" -o /tmp/official-apktool

          python3 official/patch_official.py /tmp/official-apktool \
            "$KENJI_VERSION_CODE" "$KENJI_VERSION_NAME"
          python3 official/inject_shell.py /tmp/official-apktool /tmp/shell-dex/classes.dex

          java -jar /tmp/apktool.jar b /tmp/official-apktool -o /tmp/kenji-unsigned.apk

          "$BUILD_TOOLS/zipalign" -p -f 4 /tmp/kenji-unsigned.apk /tmp/kenji-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KENJI_KEYSTORE" \
            --ks-pass "pass:$KENJI_KEYSTORE_PASSWORD" \
            --key-pass "pass:$KENJI_KEY_PASSWORD" \
            --ks-key-alias "$KENJI_KEY_ALIAS" \
            --out Kenji-Space.apk \
            /tmp/kenji-aligned.apk

          unzip -l Kenji-Space.apk | grep -E 'lib/arm64-v8a/lib(kenjinx|kenjinxjni|avcodec|skiasharp)\.so'
          unzip -l Kenji-Space.apk | grep 'classes3.dex'
          unzip -l Kenji-Space.apk | grep 'classes4.dex'
          ! unzip -l Kenji-Space.apk | grep -q 'assets/www/index.html'
          ! unzip -l Kenji-Space.apk | grep -q 'LibraryActivity'
          test "$(stat -c%s Kenji-Space.apk)" -gt 45000000

          echo "MD5=$(md5sum Kenji-Space.apk | cut -d' ' -f1)"
          echo "SIZE=$(stat -c%s Kenji-Space.apk)"
          echo "KENJI_VERSION_NAME=$KENJI_VERSION_NAME" >> "$GITHUB_ENV"
          echo "KENJI_VERSION_CODE=$KENJI_VERSION_CODE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Kenji-Space
          path: Kenji-Space.apk
      - name: Release
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type != 'debug' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MD5=$(md5sum Kenji-Space.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s Kenji-Space.apk)
          for i in 1 2 3 4 5; do
            gh release delete latest --yes && break || true
            sleep $((i * 2))
          done
          git push origin :refs/tags/latest || true
          for i in 1 2 3 4 5; do
            if gh release create latest Kenji-Space.apk \
              --title "Kenji Space ${KENJI_VERSION_NAME}" \
              --notes "Официальный дом Kenji-NX 2.1.0-pr.2 (как 1.0.25) + автопочинка прошивки: stash/junk → registered, keys/ → system/prod.keys, Eden nand → bis/.../00. Без HTML и без нашего лаунчера. Пакет dev.symbiosis.kenji. Версия ${KENJI_VERSION_NAME} (code ${KENJI_VERSION_CODE}). MD5 ${MD5} · ${SIZE} байт"
            then
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "::error::не смог выложить latest"
          exit 1
